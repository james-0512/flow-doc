# web 服務：唯讀掛載共用 volume，root 指向 publish 換版的 current symlink。
# vitepress cleanUrls 產出的是無副檔名連結，try_files 補 .html。
server {
  listen 80;
  server_name _;
  root /site/current;
  index index.html;

  # 站台是純文字（html／js／css／本地搜尋索引），壓縮率很高。
  # 不開 gzip 等於讓每個讀者多下載好幾倍。
  gzip on;
  gzip_types application/json application/javascript text/css text/html;
  # 預設 20 bytes，會對一堆小圖示做白工
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
